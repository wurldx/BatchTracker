<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Batch Tracker — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
    :root {
        --ink: #101820;
        --paper: #F7F4EC;
        --paper-line: #E3DDCC;
        --stamp: #C75D3D;
        --stamp-dark: #A8472E;
        --teal: #2D4F4F;
        --muted: #756F60;
        --card: #FFFFFF;
        --error: #B3402E;
        --success: #2D4F4F;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        background: var(--paper);
        background-image: linear-gradient(var(--paper-line) 1px, transparent 1px);
        background-size: 100% 32px;
        font-family: 'Inter', sans-serif;
        color: var(--ink);
        min-height: 100vh;
        padding: 24px 16px 60px;
    }
    .wrap { max-width: 480px; margin: 0 auto; }
    .masthead {
        display: flex; align-items: baseline; justify-content: space-between;
        padding-bottom: 16px; margin-bottom: 24px;
        border-bottom: 3px solid var(--ink);
    }
    .masthead h1 {
        font-family: 'IBM Plex Mono', monospace; font-size: 18px; font-weight: 700;
        letter-spacing: 0.02em; text-transform: uppercase;
    }
    .masthead .tag {
        font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--muted);
        text-transform: uppercase; letter-spacing: 0.08em;
    }
    .login-card {
        background: var(--card); border: 1px solid var(--paper-line);
        padding: 36px 28px; margin-top: 60px; box-shadow: 0 2px 0 var(--ink);
    }
    .login-card .stamp-mark {
        width: 56px; height: 56px; border: 3px solid var(--stamp); border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        font-family: 'IBM Plex Mono', monospace; font-weight: 700; font-size: 22px;
        color: var(--stamp); margin: 0 auto 20px; transform: rotate(-8deg);
    }
    .login-card h2 {
        font-family: 'IBM Plex Mono', monospace; font-size: 14px; text-transform: uppercase;
        letter-spacing: 0.08em; text-align: center; margin-bottom: 24px; color: var(--muted);
    }
    .field-label {
        font-family: 'IBM Plex Mono', monospace; font-size: 10px; text-transform: uppercase;
        letter-spacing: 0.08em; color: var(--muted); display: block; margin-bottom: 6px;
    }
    input[type="email"], input[type="password"], input[type="text"] {
        width: 100%; padding: 12px 14px; border: 1.5px solid var(--ink);
        background: var(--paper); font-family: 'Inter', sans-serif; font-size: 15px;
        color: var(--ink); margin-bottom: 16px; outline: none;
        transition: border-color 0.15s, box-shadow 0.15s;
    }
    input:focus { border-color: var(--stamp); box-shadow: 0 0 0 3px rgba(199, 93, 61, 0.15); }
    button {
        font-family: 'IBM Plex Mono', monospace; font-weight: 700; text-transform: uppercase;
        letter-spacing: 0.05em; font-size: 13px; cursor: pointer; border: none;
    }
    .btn-primary {
        width: 100%; padding: 13px; background: var(--ink); color: var(--paper);
        transition: background 0.15s;
    }
    .btn-primary:hover { background: var(--stamp-dark); }
    .btn-primary:active { transform: translateY(1px); }
    .status {
        margin-top: 14px; padding: 10px 12px; font-family: 'IBM Plex Mono', monospace;
        font-size: 12px; display: none; border-left: 3px solid;
    }
    .status.error { display: block; background: #FBEAE6; color: var(--error); border-color: var(--error); }
    .status.success { display: block; background: #E8EFEE; color: var(--success); border-color: var(--success); }
    .admin-panel { display: none; }
    .session-bar {
        display: flex; justify-content: space-between; align-items: center;
        font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--muted);
        margin-bottom: 24px; padding-bottom: 12px; border-bottom: 1px dashed var(--paper-line);
    }
    .logout-link {
        background: none; border: none; color: var(--muted); text-decoration: underline;
        font-family: 'IBM Plex Mono', monospace; font-size: 11px; text-transform: uppercase;
        cursor: pointer; padding: 0;
    }
    .logout-link:hover { color: var(--stamp); }
    .ledger-card {
        background: var(--card); border: 1px solid var(--paper-line);
        margin-bottom: 20px; box-shadow: 0 2px 0 var(--ink);
    }
    .ledger-head {
        font-family: 'IBM Plex Mono', monospace; font-size: 12px; text-transform: uppercase;
        letter-spacing: 0.08em; color: var(--card); background: var(--ink); padding: 10px 18px;
        display: flex; justify-content: space-between; align-items: center;
    }
    .ledger-body { padding: 24px 20px; }
    .date-row { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; }
    .date-part { display: flex; flex-direction: column; flex: 1; min-width: 70px; }
    .date-part select {
        font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 600;
        padding: 10px 8px; border: 1.5px solid var(--ink); background: var(--paper);
        color: var(--ink); width: 100%; outline: none;
    }
    .date-sep {
        font-family: 'IBM Plex Mono', monospace; font-size: 18px; color: var(--paper-line);
        align-self: flex-end; padding-bottom: 11px;
    }
    .day-letter-hint {
        display: flex; align-items: center; gap: 10px;
        padding: 12px 14px; background: var(--paper);
        border: 1px dashed var(--paper-line); margin-bottom: 20px;
        font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--muted);
    }
    .day-letter-badge {
        width: 30px; height: 30px; border: 2px solid var(--teal); border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        font-weight: 700; color: var(--teal); font-size: 14px; flex-shrink: 0;
    }
    .stamp-row {
        display: flex; align-items: center; gap: 18px; padding: 16px;
        background: var(--paper); border: 1px dashed var(--paper-line); margin-bottom: 8px;
    }
    .stamp-preview {
        width: 64px; height: 64px; flex-shrink: 0; border: 3px solid var(--stamp);
        border-radius: 50%; display: flex; align-items: center; justify-content: center;
        font-family: 'IBM Plex Mono', monospace; font-weight: 700; font-size: 22px;
        color: var(--stamp); transform: rotate(-6deg); transition: all 0.15s;
    }
    .stamp-preview.invalid { border-color: var(--error); color: var(--error); }
    .stamp-input-col { flex: 1; }
    .stamp-input-col input {
        font-family: 'IBM Plex Mono', monospace; font-size: 20px; font-weight: 700;
        text-align: center; text-transform: uppercase; padding: 10px; margin-bottom: 0;
    }
    .btn-row { display: flex; justify-content: flex-end; margin-top: 14px; }
    .btn-save { padding: 12px 28px; background: var(--stamp); color: var(--paper); transition: background 0.15s; }
    .btn-save:hover { background: var(--stamp-dark); }
    .btn-save:disabled { background: var(--paper-line); color: var(--muted); cursor: not-allowed; }
    .code-chip-list { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 4px; }
    .code-chip {
        display: flex; align-items: center; gap: 8px;
        background: var(--paper); border: 1.5px solid var(--ink);
        padding: 6px 6px 6px 14px; border-radius: 20px;
        font-family: 'IBM Plex Mono', monospace; font-weight: 700; font-size: 13px;
    }
    .code-chip button {
        background: var(--ink); color: var(--paper);
        width: 20px; height: 20px; border-radius: 50%;
        font-size: 13px; line-height: 1; display: flex; align-items: center; justify-content: center;
        padding: 0;
    }
    .code-chip button:hover { background: var(--error); }
    .no-codes { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--muted); }
    .entry-row {
        display: flex; justify-content: space-between; align-items: center;
        padding: 12px 20px; border-bottom: 1px solid var(--paper-line);
        font-family: 'IBM Plex Mono', monospace; font-size: 13px;
    }
    .entry-row:last-child { border-bottom: none; }
    .entry-date { color: var(--ink); }
    .entry-codes { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
    .entry-badge {
        padding: 3px 9px; border: 1.5px solid var(--teal); border-radius: 12px;
        font-weight: 700; color: var(--teal); font-size: 12px;
    }
    .empty-state {
        padding: 28px 20px; text-align: center;
        font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--muted);
    }
</style>
</head>
<body>

<div class="wrap">

    <div class="masthead">
        <h1>Batch Tracker</h1>
        <span class="tag">Admin</span>
    </div>

    <div class="login-card" id="loginCard">
        <div class="stamp-mark">BT</div>
        <h2>Sign in to continue</h2>
        <label class="field-label" for="emailInput">Email</label>
        <input type="email" id="emailInput" placeholder="you@example.com" />
        <label class="field-label" for="passwordInput">Password</label>
        <input type="password" id="passwordInput" placeholder="••••••••" />
        <button class="btn-primary" onclick="login()">Sign in</button>
        <div class="status" id="loginStatus"></div>
    </div>

    <div class="admin-panel" id="adminPanel">

        <div class="session-bar">
            <span id="userInfo"></span>
            <button class="logout-link" onclick="logout()">Sign out</button>
        </div>

        <div class="ledger-card">
            <div class="ledger-head">Add a production code</div>
            <div class="ledger-body">

                <div class="date-row">
                    <div class="date-part">
                        <label class="field-label">Day</label>
                        <select id="daySelect"></select>
                    </div>
                    <span class="date-sep">/</span>
                    <div class="date-part">
                        <label class="field-label">Month</label>
                        <select id="monthSelect">
                            <option value="1">Jan</option><option value="2">Feb</option>
                            <option value="3">Mar</option><option value="4">Apr</option>
                            <option value="5">May</option><option value="6">Jun</option>
                            <option value="7">Jul</option><option value="8">Aug</option>
                            <option value="9">Sep</option><option value="10">Oct</option>
                            <option value="11">Nov</option><option value="12">Dec</option>
                        </select>
                    </div>
                    <span class="date-sep">/</span>
                    <div class="date-part">
                        <label class="field-label">Year</label>
                        <select id="yearSelect"></select>
                    </div>
                </div>

                <div class="day-letter-hint">
                    <span class="day-letter-badge" id="dayLetterBadge">?</span>
                    <span id="dayLetterText">This day's letter is —. Codes must start with it.</span>
                </div>

                <div class="stamp-row">
                    <div class="stamp-preview" id="stampPreview">?</div>
                    <div class="stamp-input-col">
                        <label class="field-label">Production code</label>
                        <input type="text" id="batchInput" placeholder="e.g. RC" maxlength="6" />
                    </div>
                </div>

                <div class="status" id="saveStatus"></div>

                <div class="btn-row">
                    <button class="btn-save" id="addBtn" onclick="addCode()">Add code</button>
                </div>
            </div>
        </div>

        <div class="ledger-card">
            <div class="ledger-head">Codes for this date</div>
            <div class="ledger-body" style="padding-bottom: 20px;">
                <div class="code-chip-list" id="currentCodes">
                    <span class="no-codes">No codes yet for this date.</span>
                </div>
            </div>
        </div>

        <div class="ledger-card">
            <div class="ledger-head">Recent entries</div>
            <div id="batchList">
                <div class="empty-state">Loading…</div>
            </div>
        </div>

    </div>
    </div>
    <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
    import { getDatabase, ref, set, get } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";

    const firebaseConfig = {
  apiKey: "AIzaSyAKFfpys1vDb6Wydq6yl5MdEYJk1anzMcw",
  authDomain: "batchtracker-de89d.firebaseapp.com",
  databaseURL: "https://batchtracker-de89d-default-rtdb.firebaseio.com",
  projectId: "batchtracker-de89d",
  storageBucket: "batchtracker-de89d.firebasestorage.app",
  messagingSenderId: "854137890053",
  appId: "1:854137890053:web:164f0bb7f5dca02124c36c"
};

    const app  = initializeApp(firebaseConfig);
    const db   = getDatabase(app);
    const auth = getAuth(app);

    const BATCH_MAP = {
        1:'A',2:'B',3:'C',4:'D',5:'E',6:'F',7:'G',8:'H',9:'I',10:'J',
        11:'K',12:'L',13:'M',14:'N',15:'O',16:'P',17:'R',18:'S',19:'T',20:'U',
        21:'X',22:'Y',23:'Z',24:'2',25:'3',26:'4',27:'5',28:'6',29:'7',30:'8',31:'9'
    };

    const yearSelect    = document.getElementById('yearSelect');
    const monthSelect   = document.getElementById('monthSelect');
    const daySelect     = document.getElementById('daySelect');
    const batchInput    = document.getElementById('batchInput');
    const stampPreview  = document.getElementById('stampPreview');
    const dayLetterBadge = document.getElementById('dayLetterBadge');
    const dayLetterText  = document.getElementById('dayLetterText');
    const addBtn         = document.getElementById('addBtn');
    const saveStatus     = document.getElementById('saveStatus');

    for (let y = 2024; y <= 2030; y++) {
        const opt = document.createElement('option');
        opt.value = y; opt.text = y;
        if (y === new Date().getFullYear()) opt.selected = true;
        yearSelect.appendChild(opt);
    }
    for (let d = 1; d <= 31; d++) {
        const opt = document.createElement('option');
        opt.value = d; opt.text = String(d).padStart(2, '0');
        if (d === new Date().getDate()) opt.selected = true;
        daySelect.appendChild(opt);
    }
    monthSelect.value = new Date().getMonth() + 1;

    function expectedLetter() {
        return BATCH_MAP[parseInt(daySelect.value)] || '?';
    }

    function refreshDayLetterHint() {
        const letter = expectedLetter();
        dayLetterBadge.textContent = letter;
        dayLetterText.textContent = `This day's letter is ${letter}. Codes must start with ${letter}.`;
        validateInput();
        loadCodesForSelectedDate();
    }

    function validateInput() {
        const v = batchInput.value.toUpperCase().trim();
        stampPreview.textContent = v || '?';
        const letter = expectedLetter();

        if (!v) {
            stampPreview.classList.remove('invalid');
            saveStatus.className = 'status';
            addBtn.disabled = false;
            return;
        }

        if (v[0] !== letter) {
            stampPreview.classList.add('invalid');
            saveStatus.textContent = `"${v}" doesn't match — the ${String(daySelect.value).padStart(2,'0')} should start with ${letter}.`;
            saveStatus.className = 'status error';
            addBtn.disabled = true;
        } else {
            stampPreview.classList.remove('invalid');
            saveStatus.className = 'status';
            addBtn.disabled = false;
        }
    }

    daySelect.addEventListener('change', refreshDayLetterHint);
    monthSelect.addEventListener('change', loadCodesForSelectedDate);
    yearSelect.addEventListener('change', loadCodesForSelectedDate);
    batchInput.addEventListener('input', validateInput);

    onAuthStateChanged(auth, (user) => {
        if (user) {
            document.getElementById('loginCard').style.display = 'none';
            document.getElementById('adminPanel').style.display = 'block';
            document.getElementById('userInfo').textContent = user.email;
            refreshDayLetterHint();
            loadRecentBatches();
        } else {
            document.getElementById('loginCard').style.display = 'block';
            document.getElementById('adminPanel').style.display = 'none';
        }
    });

    window.login = async function() {
        const email    = document.getElementById('emailInput').value;
        const password = document.getElementById('passwordInput').value;
        const status   = document.getElementById('loginStatus');
        try {
            await signInWithEmailAndPassword(auth, email, password);
            status.className = 'status';
        } catch (e) {
            status.textContent = 'Email or password not recognized.';
            status.className = 'status error';
        }
    }

    window.logout = async function() { await signOut(auth); }

    function currentPath() {
        return `batches/${yearSelect.value}/${monthSelect.value}/${daySelect.value}`;
    }

    async function loadCodesForSelectedDate() {
        const listEl = document.getElementById('currentCodes');
        try {
            const snapshot = await get(ref(db, currentPath()));
            const codes = snapshot.exists() ? snapshot.val() : [];
            renderChips(codes);
        } catch (e) {
            listEl.innerHTML = '<span class="no-codes">Could not load.</span>';
        }
    }

    function renderChips(codes) {
        const listEl = document.getElementById('currentCodes');
        if (!codes || codes.length === 0) {
            listEl.innerHTML = '<span class="no-codes">No codes yet for this date.</span>';
            return;
        }
        listEl.innerHTML = codes.map((code, idx) =>
            `<span class="code-chip">${code}<button onclick="deleteCode(${idx})">✕</button></span>`
        ).join('');
    }

    window.addCode = async function() {
        const code = batchInput.value.toUpperCase().trim();
        const letter = expectedLetter();

        if (!code) {
            saveStatus.textContent = 'Enter a production code first.';
            saveStatus.className = 'status error';
            return;
        }
        if (code[0] !== letter) {
            saveStatus.textContent = `"${code}" doesn't match — this date should start with ${letter}.`;
            saveStatus.className = 'status error';
            return;
        }

        try {
            const snapshot = await get(ref(db, currentPath()));
            const codes = snapshot.exists() ? snapshot.val() : [];
            if (codes.includes(code)) {
                saveStatus.textContent = `"${code}" is already logged for this date.`;
                saveStatus.className = 'status error';
                return;
            }
            codes.push(code);
            await set(ref(db, currentPath()), codes);
            saveStatus.textContent = `Added ${code}.`;
            saveStatus.className = 'status success';
            batchInput.value = '';
            stampPreview.textContent = '?';
            stampPreview.classList.remove('invalid');
            renderChips(codes);
            loadRecentBatches();
        } catch (e) {
            saveStatus.textContent = 'Could not save: ' + e.message;
            saveStatus.className = 'status error';
        }
    }

    window.deleteCode = async function(idx) {
        try {
            const snapshot = await get(ref(db, currentPath()));
            let codes = snapshot.exists() ? snapshot.val() : [];
            codes.splice(idx, 1);
            await set(ref(db, currentPath()), codes);
            renderChips(codes);
            loadRecentBatches();
        } catch (e) {
            saveStatus.textContent = 'Could not delete: ' + e.message;
            saveStatus.className = 'status error';
        }
    }

    async function loadRecentBatches() {
        const listEl = document.getElementById('batchList');
        try {
            const snapshot = await get(ref(db, 'batches'));
            if (!snapshot.exists()) {
                listEl.innerHTML = '<div class="empty-state">No codes logged yet.</div>';
                return;
            }
            const data = snapshot.val();
            let items = [];
            for (const year in data) {
                for (const month in data[year]) {
                    for (const day in data[year][month]) {
                        const codes = data[year][month][day];
                        if (codes && codes.length) items.push({ year, month, day, codes });
                    }
                }
            }
            items.sort((a, b) => new Date(b.year, b.month-1, b.day) - new Date(a.year, a.month-1, a.day));
            items = items.slice(0, 10);
            listEl.innerHTML = items.map(i =>
                `<div class="entry-row">
                    <span class="entry-date">${String(i.day).padStart(2,'0')}/${String(i.month).padStart(2,'0')}/${i.year}</span>
                    <span class="entry-codes">${i.codes.map(c => `<span class="entry-badge">${c}</span>`).join('')}</span>
                </div>`
            ).join('');
        } catch (e) {
            listEl.innerHTML = '<div class="empty-state">Could not load entries.</div>';
        }
    }

    document.getElementById('passwordInput').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') window.login();
    });
</script>

</body>
</html>
